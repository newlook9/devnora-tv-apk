name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into Android project folders
        run: |
          mkdir -p app/src/main/java/com/devnora/tv app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          mv app-build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.java app/src/main/java/com/devnora/tv/MainActivity.java
          mv banner.png app/src/main/res/drawable/banner.png
          mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Devnora-Tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
